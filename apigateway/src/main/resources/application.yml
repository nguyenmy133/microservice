server:
  port: 8080

spring:
  application:
    name: gateway-service
  redis:
    port: 6379
    host: redis
  cloud:
    gateway:
      discovery:
        locator: true
      routes:
        - id: employeeservice
          uri: lb://employeeservice
          predicates:
            - Path=/api/v1/employees/**
          filters:
            - name: RequestRateLimiter
              args:
#                trong 1s nap lai 10 token
                redis-rate-limiter.replenishRate: 10
#                //toi da trong 1 bucket co 20 token
                redis-rate-limiter.burstCapacity: 20
#                  //1 request ton 1 token
                redis-rate-limiter.requestedTokens: 1
            - KeyAuthFilter
          
        - id: bookservice
          uri: lb://bookservice
          predicates:
            - Path=/api/v1/books/**
          filters:
            - name: RequestRateLimiter
              args:
#                trong 1s nap lai 10 token
                redis-rate-limiter.replenishRate: 10
#                //toi da trong 1 bucket co 20 token
                redis-rate-limiter.burstCapacity: 20
#                  //1 request ton 1 token
                redis-rate-limiter.requestedTokens: 1
            - KeyAuthFilter
        - id: userservice
          uri: http://localhost:9005
          predicates:
           - Path=/api/v1/users/**
          filters:
           - name: RequestRateLimiter
        - id: userservice-public
          uri: http://localhost:9005
          predicates:
           - Path=/api/v1/public/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/microservice

eureka:
  instance:
    hostname: discoveryserver
  client:
    service-url:
      defaultZone: http://discoveryserver:8761/eureka
    register-with-eureka: true
    fetch-registry: true

