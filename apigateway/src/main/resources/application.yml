server:
  port: 8080

spring:
  application:
    name: gateway-service
  redis:
    port: 6379
    host: localhost
  cloud:
    gateway:
      discovery:
        locator: true
      routes:
        - id: employeeservice
          uri: lb://employeeservice
          predicates:
            - Path=/api/v1/employees/**
          filters:
            - name: RequestRateLimiter
              args:
#                trong 1s nap lai 10 token
                redis-rate-limiter.replenishRate: 10
#                //toi da trong 1 bucket co 20 token
                redis-rate-limiter.burstCapacity: 20
#                  //1 request ton 1 token
                redis-rate-limiter.requestedTokens: 1
            - KeyAuthFilter

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

