# Spring DevTools RestartClassLoader Exclusions
#
# Vấn đề: Spring DevTools dùng 2 ClassLoader riêng biệt:
#   - Base ClassLoader: load JAR dependencies (Maven)
#   - RestartClassLoader: load project classes (hot-reload)
#
# Axon XStream khi deserialize events/commands sẽ dùng Thread.currentThread().getContextClassLoader()
# (tức RestartClassLoader). Nhưng các class của commonservice lại được load bởi Base ClassLoader
# → RestartClassLoader không thấy → ClassNotFoundException: BookUpdateStatusCommand
#
# Giải pháp: Thêm commonservice vào restart.exclude để DevTools KHÔNG dùng RestartClassLoader
# cho JAR này → class sẽ được load bởi Base ClassLoader → Axon tìm thấy class.
restart.exclude.commonservice=/commonservice.*\.jar
