spring.application.name=borrowservice

server.port=9003
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.datasource.url=jdbc:h2:mem:borrowDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Axon Server =====
# 8024 = HTTP Dashboard (Web UI) → dùng trình duyệt xem
# 8124 = gRPC port → đây mới là port Axon Framework client kết nối!
axon.axonserver.servers=localhost:8124

## Tăng timeout (ms) để tránh TimeoutException khi commit event
axon.axonserver.command-timeout=60000
axon.axonserver.query-timeout=60000
axon.axonserver.connect-timeout=10000
