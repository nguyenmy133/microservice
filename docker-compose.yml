
services:
  discoveryserver:
    build:
      context: ./discoveryserver
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - microservice-networks
  
  apigateway:
    build: 
      context: .
      dockerfile: apigateway/Dockerfile
    ports:
       - "8080:8080"
    networks:
       - microservice-networks
    depends_on:
       - discoveryserver  

networks:
  microservice-networks:
    driver: bridge